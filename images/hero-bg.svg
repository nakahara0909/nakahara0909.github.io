<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" fill="none">
  <defs>
    <!-- Circuit trace pattern -->
    <pattern id="circuit-grid" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <line x1="40" y1="0" x2="40" y2="80" stroke="#1a1a3a" stroke-width="0.3" opacity="0.08"/>
      <line x1="0" y1="40" x2="80" y2="40" stroke="#1a1a3a" stroke-width="0.3" opacity="0.08"/>
      <circle cx="40" cy="40" r="1.5" fill="#1a1a3a" opacity="0.1"/>
    </pattern>

    <!-- Fine grid overlay -->
    <pattern id="fine-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#1a1a3a" stroke-width="0.15" opacity="0.04"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#1a1a3a" stroke-width="0.15" opacity="0.04"/>
    </pattern>

    <!-- Radial glow -->
    <radialGradient id="glow-red" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8102e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c8102e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5c3a6e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#5c3a6e" stop-opacity="0"/>
    </radialGradient>

    <!-- Fade edges -->
    <linearGradient id="fade-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade-bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect width="1600" height="800" fill="#ffffff"/>

  <!-- Grid patterns -->
  <rect width="1600" height="800" fill="url(#fine-grid)"/>
  <rect width="1600" height="800" fill="url(#circuit-grid)"/>

  <!-- Decorative glows -->
  <ellipse cx="1150" cy="300" rx="400" ry="350" fill="url(#glow-red)"/>
  <ellipse cx="1350" cy="500" rx="300" ry="250" fill="url(#glow-purple)"/>

  <!-- === Large chip (right area) === -->
  <g transform="translate(950, 120)">
    <!-- Chip package -->
    <rect x="0" y="0" width="320" height="320" rx="6" fill="#1a1a3a" opacity="0.06"/>
    <rect x="8" y="8" width="304" height="304" rx="4" fill="none" stroke="#1a1a3a" stroke-width="0.8" opacity="0.1"/>

    <!-- Die area -->
    <rect x="60" y="60" width="200" height="200" rx="3" fill="#1a1a3a" opacity="0.04"/>
    <rect x="60" y="60" width="200" height="200" rx="3" fill="none" stroke="#c8102e" stroke-width="0.6" opacity="0.15"/>

    <!-- Internal blocks -->
    <rect x="75" y="75" width="55" height="40" rx="2" fill="#c8102e" opacity="0.06"/>
    <rect x="140" y="75" width="55" height="40" rx="2" fill="#5c3a6e" opacity="0.06"/>
    <rect x="205" y="75" width="40" height="40" rx="2" fill="#1a1a3a" opacity="0.05"/>
    <rect x="75" y="125" width="40" height="55" rx="2" fill="#5c3a6e" opacity="0.05"/>
    <rect x="125" y="125" width="70" height="55" rx="2" fill="#c8102e" opacity="0.04"/>
    <rect x="205" y="125" width="40" height="55" rx="2" fill="#c8102e" opacity="0.06"/>
    <rect x="75" y="190" width="55" height="55" rx="2" fill="#1a1a3a" opacity="0.05"/>
    <rect x="140" y="190" width="55" height="55" rx="2" fill="#c8102e" opacity="0.05"/>
    <rect x="205" y="190" width="40" height="55" rx="2" fill="#5c3a6e" opacity="0.06"/>

    <!-- Internal routing lines -->
    <line x1="130" y1="95" x2="140" y2="95" stroke="#c8102e" stroke-width="0.5" opacity="0.15"/>
    <line x1="195" y1="95" x2="205" y2="95" stroke="#1a1a3a" stroke-width="0.5" opacity="0.12"/>
    <line x1="160" y1="115" x2="160" y2="125" stroke="#5c3a6e" stroke-width="0.5" opacity="0.12"/>
    <line x1="115" y1="180" x2="115" y2="190" stroke="#1a1a3a" stroke-width="0.5" opacity="0.12"/>
    <line x1="225" y1="180" x2="225" y2="190" stroke="#c8102e" stroke-width="0.5" opacity="0.15"/>

    <!-- Bond pads - top -->
    <rect x="80" y="48" width="8" height="12" rx="1" fill="#1a1a3a" opacity="0.1"/>
    <rect x="110" y="48" width="8" height="12" rx="1" fill="#1a1a3a" opacity="0.1"/>
    <rect x="140" y="48" width="8" height="12" rx="1" fill="#1a1a3a" opacity="0.1"/>
    <rect x="170" y="48" width="8" height="12" rx="1" fill="#1a1a3a" opacity="0.1"/>
    <rect x="200" y="48" width="8" height="12" rx="1" fill="#1a1a3a" opacity="0.1"/>
    <rect x="230" y="48" width="8" height="12" rx="1" fill="#1a1a3a" opacity="0.1"/>
    <!-- Bond pads - bottom -->
    <rect x="80" y="260" width="8" height="12" rx="1" fill="#1a1a3a" opacity="0.1"/>
    <rect x="110" y="260" width="8" height="12" rx="1" fill="#1a1a3a" opacity="0.1"/>
    <rect x="140" y="260" width="8" height="12" rx="1" fill="#1a1a3a" opacity="0.1"/>
    <rect x="170" y="260" width="8" height="12" rx="1" fill="#1a1a3a" opacity="0.1"/>
    <rect x="200" y="260" width="8" height="12" rx="1" fill="#1a1a3a" opacity="0.1"/>
    <rect x="230" y="260" width="8" height="12" rx="1" fill="#1a1a3a" opacity="0.1"/>
    <!-- Bond pads - left -->
    <rect x="48" y="80" width="12" height="8" rx="1" fill="#1a1a3a" opacity="0.1"/>
    <rect x="48" y="110" width="12" height="8" rx="1" fill="#1a1a3a" opacity="0.1"/>
    <rect x="48" y="140" width="12" height="8" rx="1" fill="#1a1a3a" opacity="0.1"/>
    <rect x="48" y="170" width="12" height="8" rx="1" fill="#1a1a3a" opacity="0.1"/>
    <rect x="48" y="200" width="12" height="8" rx="1" fill="#1a1a3a" opacity="0.1"/>
    <rect x="48" y="230" width="12" height="8" rx="1" fill="#1a1a3a" opacity="0.1"/>
    <!-- Bond pads - right -->
    <rect x="260" y="80" width="12" height="8" rx="1" fill="#1a1a3a" opacity="0.1"/>
    <rect x="260" y="110" width="12" height="8" rx="1" fill="#1a1a3a" opacity="0.1"/>
    <rect x="260" y="140" width="12" height="8" rx="1" fill="#1a1a3a" opacity="0.1"/>
    <rect x="260" y="170" width="12" height="8" rx="1" fill="#1a1a3a" opacity="0.1"/>
    <rect x="260" y="200" width="12" height="8" rx="1" fill="#1a1a3a" opacity="0.1"/>
    <rect x="260" y="230" width="12" height="8" rx="1" fill="#1a1a3a" opacity="0.1"/>

    <!-- Pin traces extending outward -->
    <line x1="84" y1="35" x2="84" y2="48" stroke="#1a1a3a" stroke-width="0.6" opacity="0.08"/>
    <line x1="144" y1="25" x2="144" y2="48" stroke="#1a1a3a" stroke-width="0.6" opacity="0.08"/>
    <line x1="204" y1="30" x2="204" y2="48" stroke="#1a1a3a" stroke-width="0.6" opacity="0.08"/>
    <line x1="272" y1="84" x2="300" y2="84" stroke="#1a1a3a" stroke-width="0.6" opacity="0.08"/>
    <line x1="272" y1="144" x2="310" y2="144" stroke="#1a1a3a" stroke-width="0.6" opacity="0.08"/>
    <line x1="272" y1="204" x2="295" y2="204" stroke="#1a1a3a" stroke-width="0.6" opacity="0.08"/>
  </g>

  <!-- === Smaller chip (upper right) === -->
  <g transform="translate(1320, 40)">
    <rect x="0" y="0" width="140" height="140" rx="4" fill="#1a1a3a" opacity="0.04"/>
    <rect x="4" y="4" width="132" height="132" rx="3" fill="none" stroke="#1a1a3a" stroke-width="0.5" opacity="0.08"/>
    <rect x="25" y="25" width="90" height="90" rx="2" fill="none" stroke="#5c3a6e" stroke-width="0.5" opacity="0.1"/>
    <rect x="32" y="32" width="30" height="30" rx="1" fill="#5c3a6e" opacity="0.05"/>
    <rect x="68" y="32" width="40" height="30" rx="1" fill="#c8102e" opacity="0.04"/>
    <rect x="32" y="68" width="40" height="40" rx="1" fill="#c8102e" opacity="0.05"/>
    <rect x="78" y="68" width="30" height="40" rx="1" fill="#5c3a6e" opacity="0.04"/>
  </g>

  <!-- === Circuit traces (decorative) === -->
  <!-- Horizontal traces -->
  <line x1="850" y1="280" x2="950" y2="280" stroke="#c8102e" stroke-width="0.8" opacity="0.08"/>
  <line x1="900" y1="280" x2="900" y2="240" stroke="#c8102e" stroke-width="0.8" opacity="0.08"/>
  <circle cx="900" cy="240" r="2" fill="#c8102e" opacity="0.1"/>

  <line x1="1300" y1="460" x2="1400" y2="460" stroke="#1a1a3a" stroke-width="0.8" opacity="0.06"/>
  <line x1="1350" y1="460" x2="1350" y2="500" stroke="#1a1a3a" stroke-width="0.8" opacity="0.06"/>
  <line x1="1350" y1="500" x2="1420" y2="500" stroke="#1a1a3a" stroke-width="0.8" opacity="0.06"/>

  <line x1="1270" y1="180" x2="1320" y2="180" stroke="#5c3a6e" stroke-width="0.6" opacity="0.08"/>
  <line x1="1320" y1="180" x2="1320" y2="140" stroke="#5c3a6e" stroke-width="0.6" opacity="0.08"/>

  <!-- Via dots -->
  <circle cx="1270" cy="280" r="3" fill="none" stroke="#c8102e" stroke-width="0.5" opacity="0.1"/>
  <circle cx="1270" cy="280" r="1" fill="#c8102e" opacity="0.12"/>
  <circle cx="1350" cy="500" r="3" fill="none" stroke="#1a1a3a" stroke-width="0.5" opacity="0.08"/>
  <circle cx="1350" cy="500" r="1" fill="#1a1a3a" opacity="0.1"/>

  <!-- === Wafer-like circular element (far right, partially visible) === -->
  <g transform="translate(1450, 550)">
    <circle cx="0" cy="0" r="180" fill="none" stroke="#1a1a3a" stroke-width="0.5" opacity="0.05"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#1a1a3a" stroke-width="0.3" opacity="0.04"/>
    <!-- Wafer grid -->
    <line x1="-160" y1="-40" x2="160" y2="-40" stroke="#1a1a3a" stroke-width="0.2" opacity="0.03"/>
    <line x1="-160" y1="0" x2="160" y2="0" stroke="#1a1a3a" stroke-width="0.2" opacity="0.03"/>
    <line x1="-160" y1="40" x2="160" y2="40" stroke="#1a1a3a" stroke-width="0.2" opacity="0.03"/>
    <line x1="-160" y1="80" x2="160" y2="80" stroke="#1a1a3a" stroke-width="0.2" opacity="0.03"/>
    <line x1="-40" y1="-160" x2="-40" y2="160" stroke="#1a1a3a" stroke-width="0.2" opacity="0.03"/>
    <line x1="0" y1="-160" x2="0" y2="160" stroke="#1a1a3a" stroke-width="0.2" opacity="0.03"/>
    <line x1="40" y1="-160" x2="40" y2="160" stroke="#1a1a3a" stroke-width="0.2" opacity="0.03"/>
    <line x1="80" y1="-160" x2="80" y2="160" stroke="#1a1a3a" stroke-width="0.2" opacity="0.03"/>
  </g>

  <!-- === Lattice pattern (echoing logo) at middle-right === -->
  <g transform="translate(820, 480) rotate(45)" opacity="0.06">
    <rect x="0" y="0" width="18" height="18" fill="#c8102e"/>
    <rect x="22" y="0" width="18" height="18" fill="#1a1a3a"/>
    <rect x="44" y="0" width="18" height="18" fill="#c8102e"/>
    <rect x="11" y="22" width="18" height="18" fill="#1a1a3a"/>
    <rect x="33" y="22" width="18" height="18" fill="#5c3a6e"/>
    <rect x="0" y="44" width="18" height="18" fill="#5c3a6e"/>
    <rect x="22" y="44" width="18" height="18" fill="#c8102e"/>
    <rect x="44" y="44" width="18" height="18" fill="#1a1a3a"/>
  </g>

  <g transform="translate(1400, 350) rotate(45)" opacity="0.04">
    <rect x="0" y="0" width="14" height="14" fill="#5c3a6e"/>
    <rect x="18" y="0" width="14" height="14" fill="#c8102e"/>
    <rect x="9" y="18" width="14" height="14" fill="#1a1a3a"/>
    <rect x="0" y="36" width="14" height="14" fill="#c8102e"/>
    <rect x="18" y="36" width="14" height="14" fill="#5c3a6e"/>
  </g>

  <!-- Fade overlays to keep left/bottom area clean for text -->
  <rect width="900" height="800" fill="url(#fade-left)"/>
  <rect width="1600" height="800" fill="url(#fade-bottom)"/>
</svg>
