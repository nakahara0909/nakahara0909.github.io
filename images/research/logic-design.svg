<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background -->
  <rect width="400" height="300" rx="12" fill="#f7f8fa"/>

  <!-- Circuit board traces (decorative background) -->
  <line x1="0" y1="60" x2="80" y2="60" stroke="#e0e0e0" stroke-width="1.5"/>
  <line x1="80" y1="60" x2="80" y2="100" stroke="#e0e0e0" stroke-width="1.5"/>
  <line x1="320" y1="240" x2="400" y2="240" stroke="#e0e0e0" stroke-width="1.5"/>
  <line x1="320" y1="200" x2="320" y2="240" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- Neural network nodes (left - AI layer) -->
  <circle cx="70" cy="100" r="10" fill="#c8102e" opacity="0.8"/>
  <circle cx="70" cy="140" r="10" fill="#c8102e" opacity="0.6"/>
  <circle cx="70" cy="180" r="10" fill="#c8102e" opacity="0.8"/>
  <circle cx="70" cy="220" r="10" fill="#c8102e" opacity="0.6"/>

  <!-- Connection lines to logic gates -->
  <line x1="80" y1="100" x2="140" y2="110" stroke="#c8102e" stroke-width="1.5" opacity="0.4"/>
  <line x1="80" y1="140" x2="140" y2="120" stroke="#c8102e" stroke-width="1.5" opacity="0.4"/>
  <line x1="80" y1="140" x2="140" y2="170" stroke="#c8102e" stroke-width="1.5" opacity="0.4"/>
  <line x1="80" y1="180" x2="140" y2="180" stroke="#c8102e" stroke-width="1.5" opacity="0.4"/>
  <line x1="80" y1="220" x2="140" y2="190" stroke="#c8102e" stroke-width="1.5" opacity="0.4"/>

  <!-- AND gate 1 -->
  <path d="M140 100 L140 130 Q165 115 140 100 Z" fill="none" stroke="#1a1a3a" stroke-width="2"/>
  <line x1="165" y1="115" x2="195" y2="115" stroke="#1a1a3a" stroke-width="1.5"/>

  <!-- OR gate -->
  <path d="M140 160 Q150 180 140 200 Q165 200 180 180 Q165 160 140 160 Z" fill="none" stroke="#1a1a3a" stroke-width="2"/>
  <line x1="180" y1="180" x2="195" y2="180" stroke="#1a1a3a" stroke-width="1.5"/>

  <!-- Processing block (center) -->
  <rect x="195" y="95" width="80" height="105" rx="6" fill="#1a1a3a" opacity="0.9"/>
  <text x="235" y="135" text-anchor="middle" font-family="Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" opacity="0.9">Custom</text>
  <text x="235" y="152" text-anchor="middle" font-family="Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" opacity="0.9">Logic</text>
  <text x="235" y="169" text-anchor="middle" font-family="Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" opacity="0.9">Unit</text>

  <!-- Internal circuit lines -->
  <line x1="205" y1="178" x2="225" y2="178" stroke="#5c3a6e" stroke-width="1" opacity="0.6"/>
  <line x1="225" y1="178" x2="225" y2="188" stroke="#5c3a6e" stroke-width="1" opacity="0.6"/>
  <line x1="245" y1="178" x2="265" y2="178" stroke="#5c3a6e" stroke-width="1" opacity="0.6"/>
  <line x1="245" y1="178" x2="245" y2="188" stroke="#5c3a6e" stroke-width="1" opacity="0.6"/>

  <!-- Output arrows -->
  <line x1="275" y1="130" x2="310" y2="115" stroke="#1a1a3a" stroke-width="1.5"/>
  <line x1="275" y1="150" x2="310" y2="150" stroke="#1a1a3a" stroke-width="1.5"/>
  <line x1="275" y1="170" x2="310" y2="185" stroke="#1a1a3a" stroke-width="1.5"/>

  <!-- Output nodes (right - result) -->
  <circle cx="320" cy="115" r="8" fill="#5c3a6e" opacity="0.8"/>
  <circle cx="320" cy="150" r="8" fill="#5c3a6e" opacity="0.8"/>
  <circle cx="320" cy="185" r="8" fill="#5c3a6e" opacity="0.8"/>

  <!-- Output traces -->
  <line x1="328" y1="115" x2="370" y2="115" stroke="#5c3a6e" stroke-width="1.5" opacity="0.5"/>
  <line x1="328" y1="150" x2="370" y2="150" stroke="#5c3a6e" stroke-width="1.5" opacity="0.5"/>
  <line x1="328" y1="185" x2="370" y2="185" stroke="#5c3a6e" stroke-width="1.5" opacity="0.5"/>

  <!-- Efficiency indicator -->
  <rect x="345" y="100" width="40" height="100" rx="4" fill="none" stroke="#c8102e" stroke-width="1" stroke-dasharray="4 2" opacity="0.4"/>
  <rect x="352" y="160" width="26" height="33" rx="2" fill="#c8102e" opacity="0.2"/>
  <rect x="352" y="140" width="26" height="53" rx="2" fill="#c8102e" opacity="0.15"/>
  <rect x="352" y="120" width="26" height="73" rx="2" fill="#c8102e" opacity="0.1"/>

  <!-- Labels -->
  <text x="70" y="252" text-anchor="middle" font-family="Roboto, sans-serif" font-size="10" font-weight="500" fill="#c8102e" opacity="0.7">AI Model</text>
  <text x="235" y="252" text-anchor="middle" font-family="Roboto, sans-serif" font-size="10" font-weight="500" fill="#1a1a3a" opacity="0.7">Optimized Logic</text>
  <text x="365" y="252" text-anchor="middle" font-family="Roboto, sans-serif" font-size="10" font-weight="500" fill="#5c3a6e" opacity="0.7">Output</text>

  <!-- Bottom label -->
  <text x="200" y="280" text-anchor="middle" font-family="Roboto, sans-serif" font-size="13" font-weight="600" fill="#1a1a3a" opacity="0.6">AI-Optimized Logic Design</text>
</svg>
