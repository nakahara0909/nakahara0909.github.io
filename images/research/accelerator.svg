<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background -->
  <rect width="400" height="300" rx="12" fill="#f7f8fa"/>

  <!-- Chip body -->
  <rect x="120" y="70" width="160" height="160" rx="8" fill="#1a1a3a" opacity="0.95"/>
  <rect x="130" y="80" width="140" height="140" rx="4" fill="none" stroke="#5c3a6e" stroke-width="1" opacity="0.5"/>

  <!-- FPGA grid cells (reconfigurable blocks) -->
  <!-- Row 1 -->
  <rect x="142" y="92" width="26" height="26" rx="3" fill="#c8102e" opacity="0.85"/>
  <rect x="174" y="92" width="26" height="26" rx="3" fill="#5c3a6e" opacity="0.6"/>
  <rect x="206" y="92" width="26" height="26" rx="3" fill="#c8102e" opacity="0.5"/>
  <rect x="238" y="92" width="26" height="26" rx="3" fill="#5c3a6e" opacity="0.85"/>
  <!-- Row 2 -->
  <rect x="142" y="124" width="26" height="26" rx="3" fill="#5c3a6e" opacity="0.5"/>
  <rect x="174" y="124" width="26" height="26" rx="3" fill="#c8102e" opacity="0.7"/>
  <rect x="206" y="124" width="26" height="26" rx="3" fill="#5c3a6e" opacity="0.85"/>
  <rect x="238" y="124" width="26" height="26" rx="3" fill="#c8102e" opacity="0.6"/>
  <!-- Row 3 -->
  <rect x="142" y="156" width="26" height="26" rx="3" fill="#c8102e" opacity="0.6"/>
  <rect x="174" y="156" width="26" height="26" rx="3" fill="#5c3a6e" opacity="0.85"/>
  <rect x="206" y="156" width="26" height="26" rx="3" fill="#c8102e" opacity="0.85"/>
  <rect x="238" y="156" width="26" height="26" rx="3" fill="#5c3a6e" opacity="0.5"/>
  <!-- Row 4 -->
  <rect x="142" y="188" width="26" height="26" rx="3" fill="#5c3a6e" opacity="0.85"/>
  <rect x="174" y="188" width="26" height="26" rx="3" fill="#c8102e" opacity="0.5"/>
  <rect x="206" y="188" width="26" height="26" rx="3" fill="#5c3a6e" opacity="0.6"/>
  <rect x="238" y="188" width="26" height="26" rx="3" fill="#c8102e" opacity="0.85"/>

  <!-- Interconnect lines between blocks -->
  <line x1="168" y1="105" x2="174" y2="105" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="105" x2="206" y2="105" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="232" y1="105" x2="238" y2="105" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="168" y1="137" x2="174" y2="137" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="137" x2="206" y2="137" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="232" y1="137" x2="238" y2="137" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="155" y1="118" x2="155" y2="124" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="187" y1="118" x2="187" y2="124" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="219" y1="118" x2="219" y2="124" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="251" y1="118" x2="251" y2="124" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="155" y1="150" x2="155" y2="156" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="187" y1="150" x2="187" y2="156" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="219" y1="150" x2="219" y2="156" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="251" y1="150" x2="251" y2="156" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="155" y1="182" x2="155" y2="188" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="187" y1="182" x2="187" y2="188" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="219" y1="182" x2="219" y2="188" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="251" y1="182" x2="251" y2="188" stroke="#ffffff" stroke-width="1" opacity="0.4"/>

  <!-- Chip pins - top -->
  <line x1="155" y1="50" x2="155" y2="70" stroke="#1a1a3a" stroke-width="2.5" opacity="0.7"/>
  <line x1="180" y1="50" x2="180" y2="70" stroke="#1a1a3a" stroke-width="2.5" opacity="0.7"/>
  <line x1="205" y1="50" x2="205" y2="70" stroke="#1a1a3a" stroke-width="2.5" opacity="0.7"/>
  <line x1="230" y1="50" x2="230" y2="70" stroke="#1a1a3a" stroke-width="2.5" opacity="0.7"/>
  <line x1="255" y1="50" x2="255" y2="70" stroke="#1a1a3a" stroke-width="2.5" opacity="0.7"/>
  <!-- Chip pins - bottom -->
  <line x1="155" y1="230" x2="155" y2="250" stroke="#1a1a3a" stroke-width="2.5" opacity="0.7"/>
  <line x1="180" y1="230" x2="180" y2="250" stroke="#1a1a3a" stroke-width="2.5" opacity="0.7"/>
  <line x1="205" y1="230" x2="205" y2="250" stroke="#1a1a3a" stroke-width="2.5" opacity="0.7"/>
  <line x1="230" y1="230" x2="230" y2="250" stroke="#1a1a3a" stroke-width="2.5" opacity="0.7"/>
  <line x1="255" y1="230" x2="255" y2="250" stroke="#1a1a3a" stroke-width="2.5" opacity="0.7"/>
  <!-- Chip pins - left -->
  <line x1="100" y1="100" x2="120" y2="100" stroke="#1a1a3a" stroke-width="2.5" opacity="0.7"/>
  <line x1="100" y1="125" x2="120" y2="125" stroke="#1a1a3a" stroke-width="2.5" opacity="0.7"/>
  <line x1="100" y1="150" x2="120" y2="150" stroke="#1a1a3a" stroke-width="2.5" opacity="0.7"/>
  <line x1="100" y1="175" x2="120" y2="175" stroke="#1a1a3a" stroke-width="2.5" opacity="0.7"/>
  <line x1="100" y1="200" x2="120" y2="200" stroke="#1a1a3a" stroke-width="2.5" opacity="0.7"/>
  <!-- Chip pins - right -->
  <line x1="280" y1="100" x2="300" y2="100" stroke="#1a1a3a" stroke-width="2.5" opacity="0.7"/>
  <line x1="280" y1="125" x2="300" y2="125" stroke="#1a1a3a" stroke-width="2.5" opacity="0.7"/>
  <line x1="280" y1="150" x2="300" y2="150" stroke="#1a1a3a" stroke-width="2.5" opacity="0.7"/>
  <line x1="280" y1="175" x2="300" y2="175" stroke="#1a1a3a" stroke-width="2.5" opacity="0.7"/>
  <line x1="280" y1="200" x2="300" y2="200" stroke="#1a1a3a" stroke-width="2.5" opacity="0.7"/>

  <!-- Reconfigure arrows (circular) -->
  <path d="M320 130 A40 40 0 0 1 340 170" stroke="#c8102e" stroke-width="2" fill="none" opacity="0.7"/>
  <polygon points="340,170 335,162 343,164" fill="#c8102e" opacity="0.7"/>
  <path d="M340 180 A40 40 0 0 1 320 140" stroke="#c8102e" stroke-width="2" fill="none" opacity="0.7" transform="translate(0,40)"/>
  <polygon points="320,180 325,188 317,186" fill="#c8102e" opacity="0.7"/>

  <!-- AI label -->
  <text x="200" y="274" text-anchor="middle" font-family="Roboto, sans-serif" font-size="13" font-weight="600" fill="#1a1a3a" opacity="0.6">Reconfigurable FPGA Architecture</text>
</svg>
